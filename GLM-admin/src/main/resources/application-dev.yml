spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/postgres?currentSchema=xie_tm
    username: postgres
    password: ${DB_PASSWORD}

mybatis-plus:
  mapper-locations: classpath*:/mapper/**/*.xml
  type-aliases-package: com.xie.glm.system.domain
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.slf4j.Slf4jImpl

jwt:
  secret: ${JWT_SECRET:4085eeeb53ab89f4e36790184e17e10e4b5c0202935e5d1d7d8f3c1a6b2e9d7f}
  access-token-expiration: 7200000   # 120分钟
  refresh-token-expiration: 604800000  # 7天

logging:
  level:
    com.xie.glm: DEBUG
    org.springframework.security: DEBUG
    org.springframework.web: DEBUG
